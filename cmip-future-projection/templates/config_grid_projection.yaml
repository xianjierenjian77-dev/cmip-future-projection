# Monthly regional temperature example. Relative paths are based on this YAML.
# This is an editable design, not a claim that the example data are present.
# Verify Kelvin input; keep both aggregates identical. Mean adjustment preserves
# additive changes. Use method: none for an unadjusted or already adjusted input.
# Seasonal means are not block maxima: annual GEV is deliberately disabled.
# Freeze models: all to a verified list before a reproducible production run.

project:
  name: regional-temperature
  outdir: runs/{name}
  description: 'Example design: revise paths, region, periods and method for the actual
    task.'
variable:
  name: tas
  units: degC
  long_name: JJA near-surface temperature
data:
  reference:
    kind: grid
    paths:
    - data/reference/tas_monthly_*.nc
    years:
    - 1985
    - 2014
    variable: tas
    units_in: K
    units_transform:
      scale: 1.0
      offset: -273.15
    bbox:
      lat:
      - 20
      - 60
      lon:
      - 80
      - 140
    aggregate:
      months: JJA
      stat: mean
      frequency: monthly
      weight_by_days: true
      require_complete: true
      min_valid_fraction: 1.0
  models:
    kind: grid
    root: data/models
    patterns:
    - '{root}/{experiment}/{model}/{variable}_Amon_{model}_{experiment}_{member}_*.nc'
    variable: tas
    units_in: K
    units_transform:
      scale: 1.0
      offset: -273.15
    historical_experiment: historical
    scenarios:
    - ssp245
    - ssp585
    members:
    - r1i1p1f1
    member_combine: first
    models: all
    bbox:
      lat:
      - 20
      - 60
      lon:
      - 80
      - 140
    aggregate:
      months: JJA
      stat: mean
      frequency: monthly
      weight_by_days: true
      require_complete: true
      min_valid_fraction: 1.0
grid:
  lat:
    start: 20
    stop: 60
    step: 1
  lon:
    start: 80
    stop: 140
    step: 1
  method: linear
periods:
  historical:
  - 1985
  - 2014
  future:
  - 2015
  - 2100
  reference_climate:
  - 1985
  - 2014
  future_windows:
  - - 2041
    - 2070
  - - 2071
    - 2100
index:
  type: region_mean
  region:
    lat:
    - 25
    - 45
    lon:
    - 100
    - 125
    name: Example region
  anomaly: true
correction:
  method: mean
  params_period:
  - 1985
  - 2014
  multiplicative: false
ensemble:
  statistic: mean
  bands:
  - 10
  - 90
  - 20
  - 80
  weights: equal
extremes:
  enabled: false
plots:
  dpi: 300
  formats:
  - png
  - pdf
  figures:
  - timeseries
  - maps
  - kde
  timeseries:
    reference_year: 2014
  maps:
    cmap: RdBu_r
    agreement: 0.8
runtime:
  strict: true
  strict_config: true
  overwrite: false
