# ---------------------------------------------------------------------------
# Template D - pre-computed annual series (no grids)
#
# Use when the index already exists: station records, published indices, or the
# `series/index_series.npz` of an earlier run exported to CSV.
#
# Expected layout:
#   /path/obs_index.csv                  columns: year,value
#   /path/models/<MODEL>/historical.csv  columns: year,value
#   /path/models/<MODEL>/ssp245.csv      columns: year,value
# ---------------------------------------------------------------------------

project:
  name: index_from_series
  outdir: /disk1/wsr/proj/index_series/run

variable:
  name: index
  units: sigma-days
  long_name: Regional extreme index

data:
  reference:
    kind: series
    series_file: /path/obs_index.csv
    series_columns: {year: year, value: value}
    years: [1950, 2024]
  models:
    kind: series
    series_dir: /path/models
    scenarios: [ssp245, ssp585]
    models: all                      # every sub-directory of series_dir

periods:
  historical: [1950, 2014]
  future: [2026, 2100]
  reference_climate: [1950, 2014]
  future_windows: [[2026, 2045], [2046, 2065], [2066, 2085], [2086, 2100]]

index:
  type: series                       # the input is already the index

correction:
  method: mean_std
  multiplicative: false

ensemble:
  statistic: mean
  bands: [10, 90, 20, 80]
  min_models: 3

extremes:
  enabled: true
  distribution: gev
  min_years: 20
  return_periods: [2, 5, 10, 20, 50, 100, 200]
  reference_value: 39.65             # e.g. the recorded 2025 value
  shape_comparison: true

plots:
  dpi: 300
  figures: [timeseries, gev, combined, shape_box]
  timeseries:
    reference_year: 2025
    reference_value: 39.65
