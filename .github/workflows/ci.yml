name: Synthetic checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check correction and index methods
        run: python cmip-future-projection/tests/test_methods.py
      - name: Check data contracts
        run: python cmip-future-projection/tests/test_io_contracts.py
      - name: Check raw input stability and quality
        run: |
          python cmip-future-projection/tests/test_raw_io.py
          python cmip-future-projection/tests/test_quality.py
          python cmip-future-projection/tests/test_quality_workflow.py
      - name: Check statistical contracts
        run: python cmip-future-projection/tests/test_statistical_contracts.py
      - name: Check workflow contracts
        run: python cmip-future-projection/tests/test_workflow.py
      - name: Check model multiprocessing
        run: python cmip-future-projection/tests/test_parallel.py
      - name: Check daily extremes
        run: python cmip-future-projection/tests/test_daily.py
      - name: Run synthetic end-to-end example
        run: python cmip-future-projection/scripts/run.py selftest

  parallel-windows:
    name: Windows spawn (Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check spawn execution and matching results
        run: python cmip-future-projection/tests/test_parallel.py
